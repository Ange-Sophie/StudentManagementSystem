
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registered Students</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Student Management</h1>

    <p class="error" th:if="${notFound}" th:text="${notFound}"></p>

    <div th:if="${selectedStudent}" class="student-card">
        <h2>Student Details</h2>
        <p><strong>ID:</strong>
            <span th:text="${selectedStudent.id}"></span></p>
        <p><strong>Full Name:</strong>
            <span th:text="${selectedStudent.fullName}"></span></p>
        <p><strong>Email:</strong>
            <span th:text="${selectedStudent.email}"></span></p>
        <p><strong>Age:</strong>
            <span th:text="${selectedStudent.age}"></span></p>
    </div>

    <h2>All Registered Students</h2>

    <p th:if="${#lists.isEmpty(students)}">
        No students registered yet.
    </p>

    <table th:unless="${#lists.isEmpty(students)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.firstName}"></td>
            <td th:text="${student.lastName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.age}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Find Student by ID</h3>

    <form onsubmit="event.preventDefault(); window.location.href='/student/' + document.getElementById('studentId').value;">
        <input type="number" id="studentId" min="1"
               placeholder="Enter student ID" required>
        <button type="submit">Search</button>
    </form>

    <a th:href="@{/student/register}">Register Another Student</a>
</div>

</body>
</html>
